name: conformance

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto

jobs:
  fixture-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The adapter runs src/ on a bare interpreter (zero dependencies, no venv);
      # 3.11 is the floor the SDK supports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make fetch-spec
      # The runner turns a missing or crashing adapter into all-SKIP and exits
      # 0, so fail here if the adapter does not come up.
      - name: smoke (adapter prints ready)
        run: make smoke
      - name: run conformance runner (python, fixture mode)
        shell: bash
        run: |
          mkdir -p build
          { make conformance-fixture 2>&1 1>&3 | tee build/conformance-fixture.stderr; } 3>&1
      # The runner skips the floor check (and exits 0) for a key whose rows
      # are all SKIP. That is only acceptable while the floor is still 0.
      - name: guard (python-client floor not skipped)
        shell: bash
        run: |
          floor=$(jq -er '.floors["python-client"]' conformance/COUNTS.json)
          if grep -qF 'floor not checked for fully-skipped keys' build/conformance-fixture.stderr \
            && grep -qF '  python-client: ' build/conformance-fixture.stderr \
            && [ "$floor" -gt 0 ]; then
            echo "python-client rows were all SKIP but its floor is $floor" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-fixture
          path: build/*.xml
          if-no-files-found: warn

  pair-go-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make fetch-spec
      - run: make fetch-goserver
      - name: smoke (adapter prints ready)
        run: make smoke
      # ws-mixer-go at goserver.pin, built with -tags conformance.
      - run: make go-adapter
      # --sdk go,python runs both go->go and go->python, so a go->go FAIL also
      # fails this job. The go->python floor in conformance/COUNTS.json is
      # enforced by the runner.
      - name: run conformance runner (go server x python client, pair mode)
        shell: bash
        run: |
          mkdir -p build
          { make conformance-pair 2>&1 1>&3 | tee build/conformance-pair.stderr; } 3>&1
      - name: guard (go->python floor not skipped)
        shell: bash
        run: |
          floor=$(jq -er '.floors["go->python"]' conformance/COUNTS.json)
          if grep -qF 'floor not checked for fully-skipped keys' build/conformance-pair.stderr \
            && grep -qF '  go->python: ' build/conformance-pair.stderr \
            && [ "$floor" -gt 0 ]; then
            echo "go->python rows were all SKIP but its floor is $floor" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-pair
          path: build/*.xml
          if-no-files-found: warn
